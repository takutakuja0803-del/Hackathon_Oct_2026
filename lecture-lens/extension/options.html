<!doctype html><meta charset="utf-8"><title>Lecture Lens settings</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;max-width:460px;margin:40px auto;padding:0 16px;color:#14213d}
label{display:block;margin:16px 0 4px;font-weight:600} input,select{width:100%;padding:8px;font-size:15px;border:1px solid #cfd6e4;border-radius:6px}
button{margin-top:20px;background:#2b50e6;color:#fff;border:0;border-radius:6px;padding:10px 18px;font-size:15px;cursor:pointer}
</style>
<h1>Lecture Lens settings</h1>
<label for="native">My language</label><input id="native" placeholder="Spanish, Mandarin, Hindi…">
<label for="level">My English level</label>
<select id="level"><option>beginner</option><option>intermediate</option><option>advanced</option></select>
<label for="subject">Course or subject</label><input id="subject" placeholder="Economics, Nursing, Computer Science…">
<label for="siteUrl">Review site address</label><input id="siteUrl">
<button id="save">Save settings</button> <span id="ok" role="status"></span>
<script src="options.js"></script>
